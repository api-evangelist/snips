name: Snips
description: 'Snips was a Paris-based artificial intelligence company that built a
  private-by-design, on-device voice assistant platform and natural language understanding
  (NLU) technology, letting developers add offline voice interfaces to connected devices
  without sending audio to the cloud. Snips was acquired by Sonos in November 2019
  and its team became the Sonos Voice Experience group; the developer platform, hosted
  APIs, and console were subsequently discontinued. snips.ai now serves only a static
  acquisition-announcement page, and the company''s open-source libraries (notably
  the Snips NLU engine) remain archived under the github.com/snipsco organization.'
